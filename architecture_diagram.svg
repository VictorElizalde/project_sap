      .arrow { stroke: #2E86C1; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #D35400; stroke-width: 2; fill: none; stroke-dasharray: 5,5; marker-end: url(#arrowhead-orange); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
